[project]
authors = [{name = "Kolen Cheung", email = "10970208+ickc@users.noreply.github.com"}]
dependencies = ["panflute>=2.0.5,<3", "PyYAML>=6,<7"]
name = "hymn_projection"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
hymn_projection = { path = ".", editable = true }

[tool.pixi.activation]
# `quarto preview` picks its own port otherwise, which changes between runs.
env = { QUARTO_PORT = "8020" }

[tool.pixi.tasks]
# How data/ was first written, and now a way to lose it: data/ has diverged
# from the upstream YAML -- English categories, three hymns' English text, the
# irregular meters -- and this overwrites all 848 files with what upstream
# says. `md-to-yaml` is the direction to use; run this only into a scratch
# directory, and never over data/.
yaml-to-md = { cmd = "python -m hymn_projection.converter yaml-to-markdown ../selected-hymns/data.yml data", description = "DESTRUCTIVE: overwrite data/N.md with the upstream YAML, which data/ has diverged from" }
md-to-yaml = { cmd = "python -m hymn_projection.converter markdown-to-yaml data data.yml", description = "Rebuild the canonical YAML from data/N.md" }
md-to-site = { cmd = "python -m hymn_projection.converter markdown-to-site data site", description = "Project data/N.md concurrently as the slide and page Markdown, and the developer chorus report" }
# Preprocessing over data/, not a step of the build: what it writes is source.
apply-categories = { cmd = "python scripts/apply_categories.py data", description = "Rewrite each hymn's category from data/categories.tsv" }
check-categories = { cmd = "python scripts/apply_categories.py data --check", description = "Fail if any hymn's category disagrees with data/categories.tsv" }
# The other table read out of the book's front matter: the name its subject
# index files each hymn under, which no page prints over the hymn itself.
apply-titles = { cmd = "python scripts/apply_titles.py data", description = "Rewrite each hymn's title from data/titles.tsv" }
check-titles = { cmd = "python scripts/apply_titles.py data --check", description = "Fail if any hymn's title disagrees with data/titles.tsv" }
# The third: the tune the English edition sets each hymn to, read out of the
# book's two back-matter indexes of tunes and cross-checked between them.
apply-tunes = { cmd = "python scripts/apply_tunes.py data", description = "Rewrite each hymn's tune from data/tunes.tsv" }
check-tunes = { cmd = "python scripts/apply_tunes.py data --check", description = "Fail if any hymn's tune disagrees with data/tunes.tsv" }
build = { cmd = "python scripts/build_site.py site", depends-on = ["md-to-site"], description = "Regenerate the projection and render the decks and pages in parallel into site/_site" }
build-serial = { cmd = "quarto render site && python scripts/stage_scans.py site", depends-on = ["md-to-site"], description = "Regenerate the projection and render the site in one Quarto process" }
serve = { cmd = "quarto preview site --render none --port $QUARTO_PORT --host 0.0.0.0", depends-on = ["build"], description = "Build in parallel, then preview and rebuild changed pages on $QUARTO_PORT" }
check-slides = { cmd = "python scripts/check_slides.py site/_site/slide", description = "Measure every rendered deck in a browser and fail on lyrics that overflow" }
# The browser check-slides measures the rendered decks in. Quarto installs it
# out of tree, which is why this is a task rather than a dependency.
setup-chrome = { cmd = "quarto install chrome-headless-shell --no-prompt", description = "Install the headless browser check-slides needs" }
test = { cmd = "python -m unittest discover -s tests -v", description = "Run the conversion and projection tests" }
chorus-report = { cmd = "python scripts/chorus_report.py data", description = "List the hymns whose chorus the projection resolves, to check against the hymnal" }
# A meter is a syllable count and Chinese is one syllable a character, so
# this counts rather than trusts. A report while 312 hymns still disagree.
meter-report = { cmd = "python scripts/check_meters.py data", description = "List the hymns whose Chinese lyrics do not scan as their meter, their other verses or their other choruses say; --shape prints the counts" }
clean = { cmd = "rm -rf site/_site site/.quarto site/site_libs site/slide site/hymn site/subject.md site/tune.md site/metrical.md site/chorus.md site/index.html site/subject.html site/tune.html site/metrical.html site/chorus.html", description = "Remove everything the projection and the render generate" }

[tool.pixi.dependencies]
pandoc = ">=3.8.3,<4"
quarto = ">=1.9.38,<2"
panflute = ">=2.0.5,<3"
pyyaml = ">=6,<7"
