<section id="title-slide" class="hymn-title">
  <div class="hymn-number">$number$</div>
  <h1 class="title">$title$</h1>
$if(category)$
  <div class="hymn-category">$category$</div>
$endif$
$if(author)$
  <div class="hymn-author">$author$</div>
$endif$
$if(ref)$
  <div class="hymn-ref">$ref$</div>
$endif$
$for(note)$
  <div class="hymn-note">$note$</div>
$endfor$
$if(credit-note)$
  <div class="hymn-credit-note">$credit-note$</div>
$endif$
</section>
