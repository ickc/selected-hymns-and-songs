# Every hymn is rendered twice: as the deck in `slide/` it is sung from, and as
# the page in `hymn/` its text is read against the scanned hymnal on. Both are
# projections of `data/` written by `pixi run md-to-site`, and nothing here
# edits them. The Markdown says what is there; this file, `hymn.scss`,
# `page.scss` and `hymn-page.scss` say how it looks.
# `website` rather than `default` for three things a default project does not
# give: 848 decks share one copy of reveal.js in `site_libs`, where a default
# project stages it per document at 5 MB each; every deck is indexed into
# `search.json`; and the theme puts a search box over that index in the navbar,
# which is the whole of the search feature here.

# The size of the collection: the hymnal is a printed book of 848 hymns, and
# `index.md` takes the number from here rather than repeating it, so the one
# page that has to know the range names it once.
hymns: 848

# Where the text is edited. Every hymn page links to `data/N.md` here, which is
# the file a typo is fixed in -- not the Markdown that page was rendered from,
# which `md-to-site` generates and git ignores. `converter.py` reads this key
# rather than repeating a URL that has already been renamed once.
source-repo: https://github.com/ickc/selected-hymns-and-songs/blob/main

project:
  type: website
  output-dir: _site
  render:
    # The top-level glob includes the generated chorus report in developer
    # mode and only index.md when HYMN_BUILD_MODE=production omits it.
    - "*.md"
    # The two projections of `data/`: the deck a hymn is sung from and the page
    # its text is read against the scan on. Each document names its own format.
    - slide/*.md
    - hymn/*.md

website:
  title: 詩歌選集 Selected Hymns
  # Over `search.json`, which holds an entry per *slide*, so a half-remembered
  # line finds the hymn and opens at the stanza it is in.
  search:
    location: navbar
    type: textbox
  navbar:
    left:
      - href: index.md
        text: Hymns 詩歌
      # Generated by `md-to-site` from data/categories.tsv, like the decks and
      # the pages. Quarto resolves the link at render time, so the file has to
      # exist before a render -- which it does: the projection runs first.
      - href: subject.md
        text: Subjects 主題
      # Likewise, from the tune each `data/N.md` now carries.
      - href: tune.md
        text: Tunes 曲調
      # The same relation the book prints twice, grouped the other way: by the
      # meter each `data/N.md` carries, which is what says two hymns are
      # interchangeable between tunes.
      - href: metrical.md
        text: Meters 格律
    right:
      - icon: github
        href: https://github.com/ickc/selected-hymns-and-songs
        aria-label: The data and the code on GitHub
  # A deck is a presentation, not a page of the site: it carries none of this.
  page-navigation: false

format:
  # The landing page and the chorus report: the two documents here that are
  # not decks. Every document names the one of these two formats it wants in
  # its own front matter, decks included -- a project declaring more than one
  # renders each document to all of them otherwise, so every deck would also
  # be built as a plain page over the top of itself.
  html:
    # A theme rather than `theme: none`: the navbar, the search box in it and
    # the light/dark switch all come with it, and `page.scss` is only what the
    # hymnal adds -- its type, and the two-language field.
    theme:
      light: [default, page.scss, hymn-page.scss]
      dark: [darkly, page.scss, hymn-page.scss]
    toc: false
    anchor-sections: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://font.kolen.dev">
          <link rel="preconnect" href="https://font.kolen.dev" crossorigin>
          <link rel="stylesheet" href="https://font.kolen.dev/assets/faces.css">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
    # Both are fragments appended to the body and both are inert on a page
    # that does not carry the markup they look for: the number box is only on
    # the landing page, and the panes only on a hymn page.
    include-after-body:
      - goto.html
      - hymn-page.html
  revealjs:
    theme: [default, hymn.scss]
    template-partials:
      - title-slide.html
    # A projected hymn needs none of reveal's chrome, and a stray click on it
    # during a service is worse than useless.
    controls: false
    menu: false
    progress: false
    slide-number: false
    hash: true
    # `fit.html` sizes the lyrics against this logical viewport, so it is a
    # fixed contract rather than a preference.
    width: 1280
    height: 720
    margin: 0.05
    center: true
    include-in-header:
      # The font pattern from https://font.kolen.dev. `faces.css` declares the
      # faces; Noto Sans TC is a separate origin, and a Chinese hymnal is
      # exactly the consumer that has to ask for it.
      - text: |
          <link rel="preconnect" href="https://font.kolen.dev">
          <link rel="preconnect" href="https://font.kolen.dev" crossorigin>
          <link rel="stylesheet" href="https://font.kolen.dev/assets/faces.css">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
    include-after-body:
      - fit.html
